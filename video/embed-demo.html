<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anom Creative — showcase assets</title>
    <style>
      :root {
        --ink: #080807;
        --bone: #f5f1e8;
        --warm: #8a7f72;
        --accent: #b4472a;
        --line: rgba(245, 241, 232, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--bone);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        width: min(1400px, calc(100% - 48px));
        margin: 0 auto;
        padding: 72px 0 96px;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 48px;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 52px);
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 0.95;
      }

      .eyebrow,
      .label,
      footer {
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--warm);
      }

      .eyebrow {
        color: var(--accent);
      }

      section {
        margin-top: 56px;
      }

      .label {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .label span:last-child {
        color: rgba(245, 241, 232, 0.32);
      }

      video,
      img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 14px;
        background: #111;
        border: 1px solid var(--line);
      }

      .flush-video {
        border: none;
        border-radius: 0;
      }

      .phone {
        width: min(420px, 100%);
        margin: 0 auto;
        border-radius: 26px;
      }

      .split {
        display: grid;
        grid-template-columns: minmax(260px, 0.72fr) minmax(0, 1.28fr);
        gap: 40px;
        align-items: start;
      }

      .stills {
        border-radius: 18px;
      }

      footer {
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        text-transform: none;
        letter-spacing: 0.06em;
      }

      footer a {
        color: var(--bone);
        text-decoration: none;
        border-bottom: 1px solid rgba(245, 241, 232, 0.3);
      }

      @media (max-width: 820px) {
        .page {
          width: calc(100% - 32px);
          padding-top: 40px;
        }

        .split {
          grid-template-columns: 1fr;
          gap: 28px;
        }

        header {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <div class="eyebrow">Showcase assets</div>
          <h1>Anom Creative</h1>
        </div>
        <div class="eyebrow">Remotion + Playwright</div>
      </header>

      <section>
        <div class="label">
          <span>Desktop · Home</span>
          <span>1600 × 1000 · 21.9 s</span>
        </div>
        <video
          class="flush-video"
          width="1600"
          height="1000"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="out/anom-creative/desktop-home.poster.jpg"
        >
          <source src="out/anom-creative/desktop-home.mp4" type="video/mp4" />
        </video>
      </section>

      <section>
        <div class="label">
          <span>Desktop · About</span>
          <span>1600 × 1000 · 8.3 s</span>
        </div>
        <video
          width="1600"
          height="1000"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          poster="out/anom-creative/desktop-about.poster.jpg"
        >
          <source src="out/anom-creative/desktop-about.mp4" type="video/mp4" />
        </video>
      </section>

      <section class="split">
        <div>
          <div class="label">
            <span>Mobile · Home</span>
            <span>720 × 1280</span>
          </div>
          <video
            class="phone"
            width="720"
            height="1280"
            autoplay
            muted
            loop
            playsinline
            preload="metadata"
            poster="out/anom-creative/mobile.poster.jpg"
          >
            <source src="out/anom-creative/mobile.mp4" type="video/mp4" />
          </video>
        </div>

        <div>
          <div class="label">
            <span>Mobile · Three screens</span>
            <span>2400 × 1500</span>
          </div>
          <img
            class="stills"
            src="out/anom-creative/mobile-stills.webp"
            width="2400"
            height="1500"
            loading="lazy"
            decoding="async"
            alt="Anom Creative on three phones: the hero, the selected work and the contact footer."
          />
        </div>
      </section>

      <footer>
        <span>Poster = first frame. No audio track. H.264, yuv420p, faststart.</span>
        <a href="https://anomcreative.com/" target="_blank" rel="noreferrer"
          >anomcreative.com ↗</a
        >
      </footer>
    </div>
  </body>
</html>
